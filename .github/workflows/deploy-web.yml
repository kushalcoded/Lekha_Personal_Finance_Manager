# Build the Flutter web app and publish it to GitHub Pages on every push to
# main. Requires (one-time):
#   1. Repo → Settings → Pages → Source: "GitHub Actions"
#   2. Repo → Settings → Secrets and variables → Actions → add:
#        SUPABASE_URL, SUPABASE_ANON_KEY
#      (.env is gitignored, so CI reconstructs it from these secrets. Both are
#       public-safe values; the Gemini key stays server-side in the
#       gemini-proxy Edge Function and never enters the bundle.)
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env from secrets
        run: |
          {
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
          } > .env

      - name: Build web
        run: |
          flutter pub get
          flutter build web --release --base-href /Lekha_Personal_Finance_Manager/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
